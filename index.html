<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教室座位安排</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">▦</span>
      <input id="className" class="class-name" placeholder="班級名稱（例：三年二班）" aria-label="班級名稱">
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="students" role="tab">① 學生與條件</button>
      <button class="tab" data-tab="seats" role="tab">② 座位安排</button>
    </nav>
    <div class="top-actions">
      <button class="btn ghost" id="btnExport" title="下載資料備份 (JSON)">匯出</button>
      <label class="btn ghost" title="從 JSON 備份還原">匯入<input type="file" id="fileImport" accept=".json,application/json" hidden></label>
      <button class="btn ghost danger-text" id="btnReset">全部重設</button>
    </div>
  </header>

  <!-- ① 學生與條件 -->
  <main id="panel-students" class="panel">
    <section class="card">
      <div class="card-head">
        <h2>班級人數</h2>
        <span class="hint">可設定 26～40 人</span>
      </div>
      <div class="count-row">
        <div class="stepper">
          <button class="btn icon" id="countMinus" aria-label="減少人數">−</button>
          <input type="number" id="countInput" min="26" max="40" aria-label="人數">
          <button class="btn icon" id="countPlus" aria-label="增加人數">＋</button>
        </div>
        <button class="btn" id="countApply">套用人數</button>
        <span class="spacer"></span>
        <button class="btn" id="btnBatch">批次貼上名單</button>
        <button class="btn" id="btnSortNo">依座號排序</button>
      </div>
      <p class="stats" id="studentStats"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>排座條件</h2>
        <span class="hint">自動排座時會依「重要程度」綜合考量；可自行新增或刪除條件</span>
      </div>
      <div class="cond-grid" id="builtinConds"></div>
      <h3 class="sub">自訂條件 <span class="hint">（在每位學生的「規則」中勾選套用）</span></h3>
      <div id="customConds" class="custom-conds"></div>
      <button class="btn" id="btnAddTag">＋ 新增條件</button>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>學生名單</h2>
        <span class="hint">點「規則」設定相鄰／同組限制、座位偏好與自訂條件</span>
      </div>
      <div class="table-wrap">
        <table class="stu-table">
          <thead>
            <tr>
              <th class="c-no">座號</th><th class="c-name">姓名</th><th class="c-gender">性別</th>
              <th class="c-myo">近視</th><th class="c-h">身高</th><th>備註</th><th></th><th></th>
            </tr>
          </thead>
          <tbody id="stuBody"></tbody>
        </table>
      </div>
      <button class="btn" id="btnAddStudent">＋ 新增學生</button>
    </section>
  </main>

  <!-- ② 座位安排 -->
  <main id="panel-seats" class="panel" hidden>
    <section class="card toolbar-card">
      <div class="tool-row">
        <div class="seg" id="layoutSeg" role="radiogroup" aria-label="座位型式">
          <button data-layout="rows">直排</button>
          <button data-layout="groups">分組</button>
          <button data-layout="u">ㄇ字型</button>
          <button data-layout="custom">本班</button>
          <button data-layout="free">自訂</button>
        </div>
        <div class="layout-opts" id="layoutOpts"></div>
        <span class="spacer"></span>
        <button class="btn primary" id="btnArrange">✨ 依條件自動排座</button>
        <button class="btn" id="btnRandom">🎲 隨機</button>
        <button class="btn" id="btnUndo" title="復原上一步">↶ 復原</button>
      </div>
      <div class="tool-row">
        <div class="seg small" id="modeSeg" role="radiogroup" aria-label="拖曳模式">
          <button data-mode="swap">拖曳：調換學生</button>
          <button data-mode="move">拖曳：移動桌椅</button>
        </div>
        <span class="edit-tools" id="editTools">
          <button class="btn small" id="btnAddDesk">＋ 新增座位</button>
          <label class="grp-pick">新座位加入 <select id="newDeskGroup" aria-label="新座位加入的組別"></select></label>
          <button class="btn small" id="btnResetDesks">還原桌椅排列</button>
        </span>
        <span class="spacer"></span>
        <button class="btn small" id="btnFlip"></button>
        <button class="btn small" id="btnUnlockAll">解除全部鎖定</button>
        <button class="btn small" id="btnPrint">🖨 列印</button>
      </div>
    </section>

    <div class="seat-layout">
      <section class="card room-card">
        <h2 class="print-title" id="printTitle"></h2>
        <div class="room-wrap" id="roomWrap">
          <div class="room" id="room"></div>
        </div>
        <p class="hint room-hint" id="roomHint"></p>
      </section>
      <aside class="side">
        <section class="card">
          <div class="card-head"><h2>檢查結果</h2></div>
          <div id="checkList" class="check-list"></div>
        </section>
        <section class="card" id="selCard">
          <div class="card-head"><h2>選取的學生</h2></div>
          <div id="selInfo" class="sel-info"><p class="hint">點一下座位上的學生，可查看他的條件與關係。</p></div>
        </section>
        <section class="card legend">
          <div class="card-head"><h2>圖例</h2></div>
          <div class="legend-items" id="legend"></div>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="batchDialog">
    <form method="dialog" class="dlg">
      <h2>批次貼上名單</h2>
      <p class="hint">每行一位學生，可接性別、身高、近視（以空白或逗號分隔），例如：<br>
        <code>王小明 男 152 近視</code><br><code>李小華,女,148</code></p>
      <textarea id="batchText" rows="14" placeholder="王小明 男 152 近視&#10;李小華 女 148"></textarea>
      <p class="hint">貼上後會<strong>取代</strong>目前名單（少於 26 人會自動補足，超過 40 人只取前 40 位）。</p>
      <div class="dlg-actions">
        <button class="btn" value="cancel">取消</button>
        <button class="btn primary" id="batchOk" value="ok">取代名單</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
